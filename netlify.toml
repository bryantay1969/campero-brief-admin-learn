# Learning app (Next.js + API routes + Supabase)
# Env vars (Netlify UI): NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY

[build]
  command = "npm run build"
  # Required: must NOT equal the site base directory.
  # @netlify/plugin-nextjs expects the Next build output folder (.next).
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
